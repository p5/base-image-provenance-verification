name: Build and verify public provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-demo-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: registry.access.redhat.com/hi/core-runtime@sha256:e4b8f4ccc7a1ef92c469f53405de43292132f5da648ec5d2f95024f09762f407
  IMAGE: ghcr.io/p5/base-image-provenance-verification

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1
        with:
          version: v0.14.1
      - name: Check verifier and workflow
        run: |
          shellcheck scripts/*.sh
          scripts/test-policy.sh
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  build:
    needs: test
    if: github.repository == 'p5/base-image-provenance-verification' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
      - name: Install Buildah
        run: |
          sudo apt-get update
          sudo apt-get install --yes buildah
          buildah version
      - name: Resolve runtime base and check Containerfile
        run: |
          mkdir -p results
          scripts/check-containerfile.sh Containerfile "$BASE_IMAGE"
          oras manifest fetch "$BASE_IMAGE" > results/base-index.json
          printf '%s  results/base-index.json\n' "${BASE_IMAGE##*@sha256:}" | sha256sum --check
          parent_digest=$(jq -er '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
            | if length == 1 then .[0].digest else error("missing or ambiguous AMD64 base") end
          ' results/base-index.json)
          jq -n --arg base "$BASE_IMAGE" --arg parent "${BASE_IMAGE%@*}@$parent_digest" \
            '{base: $base, platform: "linux/amd64", runtimeBase: $parent}' > results/inputs.json
      - name: Build and publish with Buildah
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          authfile="$RUNNER_TEMP/buildah-auth.json"
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$REGISTRY_TOKEN" | buildah login \
            --authfile "$authfile" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          sudo buildah --storage-driver=vfs build \
            --authfile "$authfile" --isolation=chroot --platform linux/amd64 \
            --pull=always --no-cache --layers=false --format oci \
            --iidfile results/image-id --file Containerfile --tag "$IMAGE:$tag" .
          sudo buildah --storage-driver=vfs push \
            --authfile "$authfile" --digestfile results/image-digest \
            "$IMAGE:$tag" "docker://$IMAGE:$tag"
          digest="$(cat results/image-digest)"
          printf '%s@%s\n' "$IMAGE" "$digest" > results/image.txt
          printf 'image=%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
      - name: Record workflow provenance
        run: |
          recipe_sha=$(sha256sum Containerfile | awk '{print $1}')
          jq -n --slurpfile inputs results/inputs.json --rawfile recipe Containerfile \
            --arg recipe_sha "$recipe_sha" --arg revision "$GITHUB_SHA" \
            --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg version "$(buildah --version)" '
            def resource($name; $ref): {
              name: $name, uri: ("oci://" + $ref), digest: {sha256: ($ref | split("@sha256:")[1])}
            };
            $inputs[0] as $i |
            {
              buildDefinition: {
                buildType: "https://github.com/p5/base-image-provenance-verification/blob/main/docs/build-type.md",
                externalParameters: {
                  base: $i.base, platform: $i.platform, source: $source,
                  revision: $revision, containerfile: "Containerfile"
                },
                resolvedDependencies: [
                  resource("provider-base"; $i.base), resource("runtime-base"; $i.runtimeBase),
                  {name: "containerfile", digest: {sha256: $recipe_sha}, content: ($recipe | @base64)},
                  {name: "source", uri: $source, digest: {gitCommit: $revision}}
                ]
              },
              runDetails: {
                builder: {
                  id: ($source + "/.github/workflows/demo.yml@refs/heads/main"),
                  version: {buildah: $version}
                },
                metadata: {invocationId: $invocation}
              }
            }' > results/predicate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-record
          path: |
            results/predicate.json
            results/inputs.json
            results/image.txt

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-record
          path: results
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign provenance with GitHub identity
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          cosign attest --yes --type slsaprovenance1 \
            --predicate results/predicate.json "$IMAGE_REF"
          {
            printf '### Published image\n\n%s\n\n' "$IMAGE_REF"
            printf 'Approved workflow commit: %s\n\n' "$GITHUB_SHA"
            printf 'Third-party verification runs in the next job without registry credentials.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify as an anonymous third party
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          mkdir -p results
          scripts/verify.sh "$IMAGE_REF" "$GITHUB_SHA" > results/verified.jsonl
          if PROVIDER_KEY=keys/hummingbird.pub scripts/verify.sh "$IMAGE_REF" "$GITHUB_SHA"; then
            echo 'FAIL: accepted the wrong provider key' >&2
            exit 1
          fi
          if scripts/verify.sh "$IMAGE_REF" 0000000000000000000000000000000000000000; then
            echo 'FAIL: accepted the wrong workflow commit' >&2
            exit 1
          fi
          {
            printf '### Third-party verification passed\n\n'
            printf 'Image: %s\n\n' "$IMAGE_REF"
            printf 'No registry login or customer secrets. Customer transparency-log checks remain enabled.\n\n'
            printf '```sh\nscripts/verify.sh \\\n'
            printf '  %s \\\n' "$IMAGE_REF"
            printf '  %s\n```\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-verification
          path: results/verified.jsonl
          if-no-files-found: ignore
